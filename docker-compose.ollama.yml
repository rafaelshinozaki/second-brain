# Optional overlay: run Ollama INSIDE Docker (fully self-contained, no native
# Ollama needed). Handy on Linux servers without a native Ollama install.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#   # then pull the models inside the container:
#   docker exec second-brain-ollama ollama pull nomic-embed-text
#   docker exec second-brain-ollama ollama pull qwen2.5:7b-instruct
#   printf 'FROM qwen2.5:7b-instruct\nPARAMETER num_ctx 8192\n' | \
#     docker exec -i second-brain-ollama ollama create qwen2.5-brain -f -
#
# NOTE: Ollama in Docker runs on CPU unless you configure GPU passthrough
# (NVIDIA on Linux). On macOS, native Ollama is much faster (uses the GPU),
# so prefer the default setup there.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: second-brain-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    # --- Uncomment for NVIDIA GPU on Linux (needs nvidia-container-toolkit) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  graphiti-mcp:
    environment:
      - OPENAI_API_URL=http://ollama:11434/v1
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - EMBEDDER_API_URL=http://ollama:11434/v1
      - OLLAMA_API_URL=http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_started
